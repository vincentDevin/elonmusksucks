<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ElonMuskSucks.net - Predict the Chaos, Earn MuskBucks</title>
    <meta name="description" content="The world's most accurate Musk weather report. Predict Tesla stock moves, SpaceX launches, and Twitter chaos. Join thousands tracking Elon's next move." />

    <!-- Critical inline styles to prevent flash -->
    <style>
      /* Inline critical CSS for instant theme application */
      :root {
        --color-primary: #2563eb;
        --color-primary-hover: #1d4ed8;
        --color-background: #f8fafc;
        --color-surface: #ffffff;
        --color-content: #0f172a;
        --color-border: #cbd5e1;
      }

      .dark {
        --color-primary: #10b981;
        --color-primary-hover: #059669;
        --color-background: #0a0f1e;
        --color-surface: #1a1f2e;
        --color-content: #f1f5f9;
        --color-border: #374151;
      }

      html, body {
        margin: 0;
        padding: 0;
        background-color: var(--color-background);
        color: var(--color-content);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      #root {
        min-height: 100vh;
      }

      /* Prevent layout shift */
      body {
        overflow-y: scroll;
      }
    </style>

    <!-- Theme script - runs immediately, no flash -->
    <script>
      (function() {
        const theme = localStorage.getItem('theme') || 'dark';
        const html = document.documentElement;

        if (theme === 'dark') {
          html.classList.add('dark');
        } else {
          html.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"><!--ssr-outlet--></div>
    <!--server-data-->
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
