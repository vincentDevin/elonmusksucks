<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/favicon-16x16.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ElonMuskSucks.net - Predict the Chaos, Earn MuskBucks</title>
    <meta name="description" content="The world's most accurate Musk weather report. Predict Tesla stock moves, SpaceX launches, and Twitter chaos. Join thousands tracking Elon's next move." />

    <!-- Critical inline styles to prevent flash -->
    <style>
      /* Inline critical CSS for instant theme application */
      :root {
        --color-primary: #3B82F6;
        --color-primary-hover: #1D4ED8;
        --color-background: #FFFFFF;
        --color-surface: #F8FAFC;
        --color-content: #1E293B;
        --color-border: #E2E8F0;
      }

      .dark {
        --color-primary: #10B981;
        --color-primary-hover: #059669;
        --color-background: #0a0f1e;
        --color-surface: #181f2a;
        --color-content: #F9FAFB;
        --color-border: #374151;
      }

      html, body {
        margin: 0;
        padding: 0;
        background-color: var(--color-background);
        color: var(--color-content);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Hide content initially to prevent FOUC */
      #root {
        min-height: 100vh;
        opacity: 0;
        transition: opacity 0.4s ease-in-out;
      }

      #root.ready {
        opacity: 1;
      }

      /* Prevent layout shift */
      body {
        overflow-y: scroll;
      }

      /* Loading overlay */
      #loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: var(--color-background);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        opacity: 1;
        transition: opacity 0.4s ease-in-out;
      }

      #loading-overlay.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      /* Loading spinner */
      .loading-spinner {
        width: 50px;
        height: 50px;
        border: 3px solid var(--color-border);
        border-top-color: var(--color-primary);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      /* Loading text */
      .loading-text {
        margin-top: 1rem;
        font-size: 0.875rem;
        color: var(--color-content);
        opacity: 0.7;
      }
    </style>

    <!-- Theme script - runs immediately, no flash -->
    <script>
      (function() {
        const theme = localStorage.getItem('theme') || 'dark';
        const html = document.documentElement;

        if (theme === 'dark') {
          html.classList.add('dark');
        } else {
          html.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body>
    <!-- Loading overlay - visible by default -->
    <div id="loading-overlay">
      <div style="display: flex; flex-direction: column; align-items: center;">
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading ElonMuskSucks.net...</div>
      </div>
    </div>

    <!-- Main content - hidden initially -->
    <div id="root"><!--ssr-outlet--></div>
    <!--server-data-->
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
