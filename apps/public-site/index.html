<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elon Musk Sucks - Prediction Market</title>
    <meta name="description" content="The world's most accurate Musk weather report. Predict the chaos, earn MuskBucks." />
    
    <!-- Theme script to prevent flash -->
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('theme') || 'dark';
          if (theme === 'dark' || theme.includes('dark')) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-background text-content">
    <div id="root"><!--ssr-outlet--></div>
    <!--server-data-->
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
