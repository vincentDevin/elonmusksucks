# Supervisord configuration for public-site
# Runs both Nginx (static assets + reverse proxy) and Node.js (SSR server)

[supervisord]
nodaemon=true
user=nginx
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:nginx]
command=nginx -g "daemon off;"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=10

[program:ssr-server]
command=npx tsx /app/apps/public-site/server.ts
directory=/app
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=5
environment=NODE_ENV="production",PORT="3001"
