# fly.toml - Pong Server
# Using local build approach (Dockerfile.local)
app = 'ems-pong'
primary_region = 'iad' # Same region as main server for low latency

[build]
  dockerfile = 'apps/pong-server/Dockerfile.local'

[env]
  NODE_ENV = 'production'
  PONG_SERVER_PORT = '5001'

[http_service]
  internal_port = 5001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[http_service.checks]]
  grace_period = '10s'
  interval = '30s'
  method = 'GET'
  timeout = '5s'
  path = '/health'

[[vm]]
  size = 'shared-cpu-1x'  # Upgrade for production load
  memory = '256mb'
  cpus = 1

[[services]]
  protocol = 'tcp'
  internal_port = 5001

  [[services.ports]]
    port = 80
    handlers = ['http']
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [[services.tcp_checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '5s'

[restart]
  policy = 'on-failure'
  max_retries = 3
