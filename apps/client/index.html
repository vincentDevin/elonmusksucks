<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ═══════════════════════════════════════════════════════════════ -->
    <!-- Security Headers -->
    <!-- ═══════════════════════════════════════════════════════════════ -->

    <!-- Content Security Policy (CSP) -->
    <!-- Protects against XSS, clickjacking, and code injection attacks -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob: https: https://*.fly.storage.tigris.dev https://ui-avatars.com;
        font-src 'self' data:;
        connect-src 'self' ws: wss: https://api.elonmusksucks.net https://pong.elonmusksucks.net;
        frame-ancestors 'none';
        base-uri 'self';
        form-action 'self';
        upgrade-insecure-requests;
      "
    />

    <!-- X-Frame-Options: Prevents clickjacking -->
    <meta http-equiv="X-Frame-Options" content="DENY" />

    <!-- X-Content-Type-Options: Prevents MIME sniffing -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />

    <!-- Referrer Policy: Controls referrer information -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- ═══════════════════════════════════════════════════════════════ -->
    <!-- Application Metadata -->
    <!-- ═══════════════════════════════════════════════════════════════ -->

    <title>ElonMuskSucks.net - Track the Chaos</title>
    <meta
      name="description"
      content="The world's most accurate Musk weather report. Predict Tesla stock moves, SpaceX launches, and Twitter chaos. Join the community!"
    />

    <!-- Open Graph (Social Sharing) -->
    <meta property="og:title" content="ElonMuskSucks.net - Track the Chaos" />
    <meta property="og:description" content="Predict Musk's next move and climb the leaderboard" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
