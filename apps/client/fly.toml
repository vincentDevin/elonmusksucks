# fly.toml - Client App (SPA with Nginx)
app = 'ems-client'
primary_region = 'ord'

[build]
  dockerfile = 'apps/client/Dockerfile'
  build-target = 'runner'
  [build.args]

[env]
  NODE_ENV = 'production'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = '10s'
  interval = '30s'
  method = 'GET'
  timeout = '5s'
  path = '/'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1
