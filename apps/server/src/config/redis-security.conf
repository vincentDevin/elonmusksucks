# apps/server/src/config/redis-security.conf
# -----------------------------------------------------------------------------
# Redis security configuration for production deployment
# Apply with: redis-server /path/to/redis-security.conf
# -----------------------------------------------------------------------------

# Bind to localhost only (for single-server setup)
# For multi-server: bind 127.0.0.1 10.0.0.1 (replace with actual private IP)
bind 127.0.0.1

# Enable protected mode
protected-mode yes

# Set port (default 6379, consider changing for security)
port 6379

# Require authentication
# In production, generate a strong password: openssl rand -base64 32
requirepass your_strong_redis_password_here

# Disable dangerous commands in production
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command KEYS ""
rename-command CONFIG redis_config_cmd
rename-command SHUTDOWN redis_shutdown_cmd
rename-command DEBUG ""
rename-command EVAL ""
rename-command SCRIPT ""

# Enable ACL (Access Control Lists) for fine-grained permissions
aclfile /etc/redis/users.acl

# Logging
logfile /var/log/redis/redis-server.log
loglevel notice

# Memory management
maxmemory 512mb
maxmemory-policy allkeys-lru

# Persistence (adjust based on needs)
save 900 1
save 300 10
save 60 10000

# RDB file permissions
rdbcompression yes
rdbchecksum yes

# Security settings
tcp-keepalive 300
timeout 300

# Disable potentially dangerous modules
# module-load-from-config no

# Client connection limits
maxclients 1000
tcp-backlog 511

# Slow log for performance monitoring
slowlog-log-slower-than 10000
slowlog-max-len 128