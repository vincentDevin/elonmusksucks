# fly.toml - Main Server (API Backend)
app = 'ems-api'
primary_region = 'ord'

[build]
  dockerfile = 'Dockerfile'
  build-target = 'runner'
  [build.args]

[env]
  NODE_ENV = 'production'
  PORT = '5000'

# API Server Process
[processes]
  app = "node src/index.js"
  worker = "sh -c 'node src/workers/payout.worker.js & node src/workers/leaderboard.worker.js & node src/workers/leaderboard-snapshot.worker.js & node src/workers/feed.worker.js & node src/workers/article.worker.js & node src/workers/pong-payout.worker.js & wait'"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  # CRITICAL: Sticky sessions for Socket.IO WebSocket connections
  # Without this, clients can connect to different instances causing:
  # - Duplicate room joins across instances
  # - Events firing multiple times
  # - Connection state inconsistency
  # Cookie-based session affinity ensures client stays on same instance
  [http_service.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 800

  # Load balancer configuration for WebSocket support
  [http_service.http_options.response.headers]
    X-Frame-Options = "DENY"

[[http_service.checks]]
  grace_period = '10s'
  interval = '30s'
  method = 'GET'
  timeout = '5s'
  path = '/health'

# Prometheus Metrics - Scraped by Fly.io and sent to VictoriaMetrics
# Metrics available at https://fly-metrics.net
[metrics]
  port = 5000
  path = "/metrics"

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
