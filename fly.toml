# Fly.io configuration for elonmusksucks API server
app = "elonmusksucks-api"
primary_region = "sjc" # Change to your preferred region

[build]
  dockerfile = "apps/server/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "5000"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = false  # Keep at least min_machines running
  auto_start_machines = true
  min_machines_running = 2    # Always have 2 instances for HA

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

# Resource allocation
[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1

# Auto-scaling configuration
[scaling]
  min_count = 2  # Minimum instances for HA
  max_count = 4  # Scale up to 4 under load

# Metrics and monitoring
[metrics]
  port = 9091
  path = "/metrics"
