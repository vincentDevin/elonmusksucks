# Fly.io configuration for BullMQ workers
app = "elonmusksucks-workers"
primary_region = "sjc"

[build]
  dockerfile = "apps/server/Dockerfile.worker"

[env]
  NODE_ENV = "production"

# No HTTP service for workers
[processes]
  worker = "node apps/server/dist/src/workers/payout.worker.js & node apps/server/dist/src/workers/leaderboard.worker.js & node apps/server/dist/src/workers/leaderboard-snapshot.worker.js & node apps/server/dist/src/workers/feed.worker.js & node apps/server/dist/src/workers/article.worker.js & node apps/server/dist/src/workers/pong-payout.worker.js & wait"

# Resource allocation (more RAM for workers)
[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

# Workers don't need auto-scaling usually
[scaling]
  min_count = 1
  max_count = 2
